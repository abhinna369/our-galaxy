<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#01020a">

<title>Darling uuu — Our Little Galaxy</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#01020a;
    touch-action:none;
}

body{
    color:white;
    font-family:Georgia,"Times New Roman",serif;
}


/* =========================================================
   OPENING
========================================================= */

#opening{
    position:fixed;
    inset:0;
    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 38%,
            #15266f 0%,
            #0a1035 28%,
            #030513 62%,
            #000107 100%
        );

    transition:
        opacity 1.8s ease,
        visibility 1.8s ease;
}

.opening-glow{
    position:absolute;

    width:75vw;
    height:75vw;

    max-width:600px;
    max-height:600px;

    border-radius:50%;

    background:rgba(52,92,255,.08);

    filter:blur(80px);

    animation:
        openingGlow 5s ease-in-out infinite alternate;
}

@keyframes openingGlow{

    from{
        transform:scale(.9);
        opacity:.5;
    }

    to{
        transform:scale(1.15);
        opacity:1;
    }
}

.opening-content{
    position:relative;
    z-index:5;

    width:90%;

    text-align:center;

    opacity:0;

    animation:
        introAppear 2s ease forwards;
}

.opening-eyebrow{
    font-family:Arial,sans-serif;

    font-size:9px;

    letter-spacing:7px;

    text-transform:uppercase;

    color:#91a9ef;

    margin-bottom:18px;
}

.opening-content h1{

    font-size:
        clamp(45px,13vw,100px);

    font-weight:normal;

    letter-spacing:2px;

    color:#f7f9ff;

    text-shadow:
        0 0 12px #fff,
        0 0 30px #7898ff,
        0 0 60px #426dff,
        0 0 100px rgba(55,91,255,.8);
}

.opening-content p{

    margin-top:18px;

    color:#9ba9d4;

    font-size:13px;

    letter-spacing:3px;
}

@keyframes introAppear{

    from{
        opacity:0;
        transform:
            translateY(18px)
            scale(.97);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================================================
   RAIN
========================================================= */

#rain{
    position:absolute;
    inset:0;
    overflow:hidden;
}

.rain{

    position:absolute;

    top:-100px;

    width:2px;

    height:55px;

    border-radius:50%;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(102,157,255,.25),
            rgba(166,204,255,.9),
            #fff
        );

    box-shadow:
        0 0 8px rgba(110,165,255,.8),
        0 0 16px rgba(80,130,255,.35);

    animation:
        rainFall linear forwards;
}

.rain::after{

    content:"";

    position:absolute;

    bottom:-6px;
    left:-2px;

    width:6px;
    height:6px;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 8px #b6d4ff,
        0 0 15px #6995ff;
}

@keyframes rainFall{

    to{
        transform:
            translateY(120vh);

        opacity:0;
    }
}


/* =========================================================
   GALAXY
========================================================= */

#galaxy{

    position:fixed;

    inset:0;

    overflow:hidden;

    visibility:hidden;

    opacity:0;

    background:

        radial-gradient(
            ellipse at 50% 50%,
            rgba(34,60,175,.2),
            transparent 45%
        ),

        radial-gradient(
            ellipse at 20% 70%,
            rgba(24,76,220,.1),
            transparent 40%
        ),

        #01020a;

    transition:
        opacity 2s ease;
}

#galaxy.visible{

    visibility:visible;

    opacity:1;
}


/* =========================================================
   MOVABLE CAMERA
========================================================= */

#camera{

    position:absolute;

    left:-12%;
    top:-12%;

    width:124%;
    height:124%;

    transform:
        translate3d(0,0,0)
        scale(1.08);

    will-change:transform;
}


/* =========================================================
   NEBULA
========================================================= */

.nebula{

    position:absolute;

    border-radius:50%;

    pointer-events:none;

    filter:blur(65px);

    opacity:.42;

    animation:
        nebulaFloat 15s ease-in-out infinite alternate;
}

.nebula.one{

    width:85vw;
    height:38vw;

    left:-20vw;
    top:15vh;

    background:
        rgba(35,73,255,.21);

    transform:rotate(-24deg);
}

.nebula.two{

    width:70vw;
    height:35vw;

    right:-20vw;
    top:47vh;

    background:
        rgba(101,45,255,.16);

    animation-delay:-4s;
}

.nebula.three{

    width:55vw;
    height:30vw;

    left:28vw;
    top:62vh;

    background:
        rgba(0,154,255,.13);

    animation-delay:-8s;
}

.nebula.four{

    width:40vw;
    height:40vw;

    left:38vw;
    top:8vh;

    background:
        rgba(72,103,255,.1);

    animation-delay:-11s;
}

@keyframes nebulaFloat{

    from{
        transform:
            translate(-2%,-2%)
            rotate(-22deg)
            scale(1);
    }

    to{
        transform:
            translate(3%,3%)
            rotate(-15deg)
            scale(1.12);
    }
}


/* =========================================================
   GALAXY DISK
========================================================= */

.galaxy-disk{

    position:absolute;

    width:180vw;
    height:56vw;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        rotate(-17deg);

    border-radius:50%;

    border:
        1px solid rgba(111,145,255,.07);

    box-shadow:

        0 0 100px
        rgba(65,100,255,.08),

        inset 0 0 100px
        rgba(72,112,255,.05);
}


/* =========================================================
   DISTANT STARS
========================================================= */

#distantStars{

    position:absolute;

    inset:0;
}

.distant-star{

    position:absolute;

    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 5px #fff,
        0 0 9px rgba(144,179,255,.7);

    animation:
        twinkle ease-in-out infinite alternate;
}

@keyframes twinkle{

    from{
        opacity:.15;
        transform:scale(.55);
    }

    to{
        opacity:1;
        transform:scale(1.35);
    }
}


/* =========================================================
   HEADER
========================================================= */

.galaxy-header{

    position:fixed;

    z-index:100;

    top:25px;
    left:0;

    width:100%;

    text-align:center;

    pointer-events:none;
}

.galaxy-header .tiny{

    font-family:Arial,sans-serif;

    font-size:8px;

    letter-spacing:5px;

    text-transform:uppercase;

    color:#7489c7;
}

.galaxy-header h2{

    margin-top:8px;

    font-size:24px;

    font-weight:normal;

    letter-spacing:2px;

    color:#eef2ff;

    text-shadow:
        0 0 15px rgba(122,157,255,.8),
        0 0 30px rgba(61,100,255,.35);
}


/* =========================================================
   INTERACTIVE STARS
========================================================= */

.star{

    position:absolute;

    z-index:40;

    width:50px;
    height:50px;

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:pointer;

    user-select:none;
}

.star-dot{

    position:relative;

    width:7px;
    height:7px;

    border-radius:50%;

    background:#fff;

    box-shadow:

        0 0 6px #fff,
        0 0 14px #a4c2ff,
        0 0 30px #557fff,
        0 0 55px rgba(62,106,255,.8);

    animation:
        starPulse 2s ease-in-out infinite;
}

.star-dot::before,
.star-dot::after{

    content:"";

    position:absolute;

    border-radius:50%;

    background:
        rgba(169,198,255,.75);
}

.star-dot::before{

    width:38px;
    height:1px;

    left:-15px;
    top:3px;
}

.star-dot::after{

    width:1px;
    height:38px;

    left:3px;
    top:-15px;
}

@keyframes starPulse{

    0%,100%{
        transform:scale(.7);
        opacity:.65;
    }

    50%{
        transform:scale(1.4);
        opacity:1;
    }
}


/* =========================================================
   HEARTS
========================================================= */

.heart{

    font-family:Arial,sans-serif;

    font-size:23px;

    color:#f1f5ff;

    filter:

        drop-shadow(0 0 5px #fff)
        drop-shadow(0 0 13px #7195ff)
        drop-shadow(0 0 28px #426aff);

    animation:
        heartPulse 2.4s ease-in-out infinite;
}

@keyframes heartPulse{

    0%,100%{
        transform:scale(.88);
    }

    50%{
        transform:scale(1.2);
    }
}


/* =========================================================
   STAR POSITIONS
========================================================= */

.a1{left:9%;top:29%}
.a2{left:18%;top:44%}
.a3{left:28%;top:25%}
.a4{left:37%;top:38%}
.a5{left:48%;top:26%}
.a6{left:58%;top:42%}
.a7{left:69%;top:28%}
.a8{left:81%;top:37%}
.a9{left:89%;top:52%}
.a10{left:75%;top:57%}
.a11{left:61%;top:64%}
.a12{left:47%;top:58%}
.a13{left:33%;top:64%}
.a14{left:20%;top:60%}
.a15{left:11%;top:72%}
.a16{left:39%;top:75%}
.a17{left:56%;top:76%}
.a18{left:72%;top:75%}
.a19{left:86%;top:68%}
.a20{left:52%;top:48%}


/* =========================================================
   MESSAGE
========================================================= */

#message{

    position:fixed;

    z-index:500;

    left:50%;
    bottom:6vh;

    width:min(89%,450px);

    padding:25px 23px 22px;

    text-align:center;

    border-radius:23px;

    border:
        1px solid rgba(132,163,255,.28);

    background:
        linear-gradient(
            145deg,
            rgba(9,15,48,.92),
            rgba(2,6,25,.88)
        );

    backdrop-filter:blur(22px);

    -webkit-backdrop-filter:blur(22px);

    box-shadow:

        0 0 60px
        rgba(50,82,255,.2),

        0 15px 60px
        rgba(0,0,0,.45),

        inset 0 0 30px
        rgba(105,140,255,.04);

    opacity:0;

    pointer-events:none;

    transform:
        translate(-50%,30px)
        scale(.95);

    transition:
        opacity .65s ease,
        transform .65s ease;
}

#message.show{

    opacity:1;

    pointer-events:auto;

    transform:
        translate(-50%,0)
        scale(1);
}

.message-label{

    font-family:Arial,sans-serif;

    font-size:8px;

    letter-spacing:4px;

    text-transform:uppercase;

    color:#8197d8;
}

#messageText{

    margin-top:13px;

    color:#f4f6ff;

    font-family:

        "Noto Serif Devanagari",
        "Nirmala UI",
        "Mangal",
        Georgia,
        serif;

    font-size:18px;

    line-height:1.75;
}

#closeMessage{

    margin-top:17px;

    padding:8px 14px;

    border:
        1px solid rgba(126,153,225,.3);

    border-radius:20px;

    background:
        rgba(30,48,110,.12);

    color:#8198d7;

    font-family:Arial,sans-serif;

    font-size:8px;

    letter-spacing:2px;

    cursor:pointer;
}


/* =========================================================
   STAR BURST
========================================================= */

.burst{

    position:fixed;

    z-index:450;

    width:5px;
    height:5px;

    border-radius:50%;

    background:#fff;

    box-shadow:

        0 0 10px #fff,
        0 0 18px #80a5ff,
        0 0 30px #527bff;

    pointer-events:none;

    animation:
        burst .95s ease-out forwards;
}

@keyframes burst{

    0%{

        opacity:1;

        transform:
            translate(0,0)
            scale(1.6);
    }

    100%{

        opacity:0;

        transform:
            translate(var(--x),var(--y))
            scale(0);
    }
}


/* =========================================================
   MUSIC BUTTON
========================================================= */

#musicButton{

    position:fixed;

    z-index:300;

    top:22px;
    right:20px;

    width:43px;
    height:43px;

    border-radius:50%;

    border:
        1px solid rgba(132,163,255,.3);

    background:
        rgba(5,10,35,.65);

    backdrop-filter:blur(12px);

    -webkit-backdrop-filter:blur(12px);

    color:#dce6ff;

    font-size:16px;

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:pointer;

    box-shadow:
        0 0 20px rgba(65,105,255,.16);

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}

#musicButton.playing{

    box-shadow:
        0 0 12px rgba(117,157,255,.65),
        0 0 30px rgba(57,100,255,.35);

    animation:
        musicGlow 2s ease-in-out infinite;
}

@keyframes musicGlow{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.08);
    }
}

#musicButton:active{
    transform:scale(.9);
}


/* =========================================================
   MUSIC LABEL
========================================================= */

#musicLabel{

    position:fixed;

    z-index:290;

    top:31px;
    right:72px;

    font-family:Arial,sans-serif;

    font-size:8px;

    letter-spacing:2px;

    color:rgba(159,180,240,.7);

    opacity:0;

    transform:
        translateX(10px);

    transition:
        opacity .5s ease,
        transform .5s ease;

    pointer-events:none;
}

#musicLabel.show{

    opacity:1;

    transform:
        translateX(0);
}


/* =========================================================
   BOTTOM HINT
========================================================= */

.hint{

    position:fixed;

    z-index:100;

    left:0;
    bottom:18px;

    width:100%;

    text-align:center;

    font-family:Arial,sans-serif;

    font-size:8px;

    letter-spacing:3px;

    color:
        rgba(116,137,193,.55);

    pointer-events:none;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    #camera{

        left:-25%;
        top:-18%;

        width:150%;
        height:136%;
    }

    .galaxy-disk{

        width:210vw;
        height:72vw;
    }

    .galaxy-header{

        top:23px;
    }

    .galaxy-header h2{

        font-size:21px;
    }

    #message{

        bottom:5vh;

        padding:
            22px 19px 20px;
    }

    #messageText{

        font-size:16px;

        line-height:1.8;
    }

    .star{

        width:44px;
        height:44px;
    }

    .hint{

        bottom:15px;
    }

    #musicButton{

        top:19px;
        right:16px;
    }

    #musicLabel{

        top:29px;
        right:68px;
    }
}

</style>
</head>


<body>


<!-- =======================================================
     OPENING
======================================================= -->

<div id="opening">

    <div class="opening-glow"></div>

    <div id="rain"></div>

    <div class="opening-content">

        <div class="opening-eyebrow">
            A universe made for
        </div>

        <h1>
            Darling uuu
        </h1>

        <p>
            something is waiting among the stars...
        </p>

    </div>

</div>


<!-- =======================================================
     GALAXY
======================================================= -->

<div id="galaxy">

    <div id="camera">

        <div class="nebula one"></div>
        <div class="nebula two"></div>
        <div class="nebula three"></div>
        <div class="nebula four"></div>

        <div class="galaxy-disk"></div>

        <div id="distantStars"></div>


        <!-- =================================================
             STAR 1
        ================================================== -->

        <div class="star a1"
             data-message="आपसे मिलकर यूँ लगा, जैसे किसी अधूरी दुआ को जवाब मिल गया, ज़िंदगी तो पहले भी थी मेरी, मगर आपके आने से उसे घर मिल गया।">

            <div class="star-dot"></div>

        </div>


        <!-- =================================================
             STAR 2
        ================================================== -->

        <div class="star a2"
             data-message="आपकी मुस्कुराहट में कुछ तो बात है, जो मेरे हर दिन को ख़ास कर देती है, आप बस एक बार प्यार से देख लीजिए, मेरी सारी दुनिया वहीं ठहर जाती है।">

            <div class="star-dot"></div>

        </div>


        <!-- =================================================
             HEART 3
        ================================================== -->

        <div class="star a3"
             data-message="ना जाने किस दुआ का असर हैं आप, ना जाने किस ख़्वाब की ताबीर हैं आप, बस इतना जानता हूँ मैं— मेरी ज़िंदगी की सबसे ख़ूबसूरत वजह हैं आप।">

            <div class="heart">
                ♥
            </div>

        </div>


        <!-- 4 -->

        <div class="star a4"
             data-message="आपसे बात होती है तो सुकून मिलता है, आप ख़ामोश हों तो भी अपनापन मिलता है, पता नहीं कैसा रिश्ता है आपसे, आप दूर होकर भी सबसे क़रीब लगते हैं।">

            <div class="star-dot"></div>

        </div>


        <!-- 5 -->

        <div class="star a5"
             data-message="आपको पाना कोई इत्तेफ़ाक़ नहीं, शायद मेरी क़िस्मत की सबसे हसीन लिखावट है, वरना इतनी बड़ी दुनिया में, किसी एक इंसान से इतना प्यार कहाँ होता है।">

            <div class="heart">
                ♥
            </div>

        </div>


        <!-- 6 -->

        <div class="star a6"
             data-message="आप मेरे लिए सिर्फ़ मोहब्बत नहीं, मेरी रोज़ की छोटी-सी ख़ुशी हैं, दिन कितना भी मुश्किल क्यों ना हो, आपकी एक बात मेरी पूरी दुनिया ठीक कर देती है।">

            <div class="star-dot"></div>

        </div>


        <!-- 7 -->

        <div class="star a7"
             data-message="आपके साथ कुछ ख़ास करने की ज़रूरत नहीं, बस आपका पास होना ही काफ़ी है, क्योंकि आपके साथ बिताया हुआ साधारण-सा पल भी, मेरे लिए किसी ख़ूबसूरत याद से कम नहीं।">

            <div class="star-dot"></div>

        </div>

            <div class="heart">

            </div>

        </div>


        <!-- 9 -->

        <div class="star a9"

            <div class="star-dot"></div>

        </div>


        <!-- 10 -->

        <div class="star a10"
             data-message="कभी-कभी सोचता हूँ, मैंने ऐसा क्या अच्छा किया था, जो ज़िंदगी ने मुझे आपसे मिला दिया— फिर दिल कहता है, शायद यही मेरी सबसे ख़ूबसूरत क़िस्मत थी।">

            <div class="heart">
                ♥
            </div>

        </div>


        <!-- 11 -->

        <div class="star a11"
             data-message="आपके सामने दिल को कुछ छुपाना नहीं पड़ता, ना ख़ुश होने की वजह चाहिए, ना उदास होने की, आपके साथ बस मैं, मैं रह सकता हूँ— और शायद यही मोहब्बत की सबसे ख़ूबसूरत बात है।">

            <div class="star-dot"></div>

        </div>


        <!-- 12 -->

        <div class="star a12"
             data-message="आप मेरे दिन का वो हिस्सा हैं, जिसका इंतज़ार हर सुबह रहती है, और रात चाहे कितनी भी लंबी हो, आपकी याद उसे भी ख़ूबसूरत बना देती है।">

            <div class="heart">
                ♥
            </div>

        </div>


        <!-- 13 -->

        <div class="star a13"
             data-message="आपको देखकर आज भी दिल थोड़ा ठहर जाता है, जैसे पहली बार देखा हो आपको, मोहब्बत शायद वही है— जहाँ वक़्त बीतता रहे, मगर एहसास नया रहे।">

            <div class="star-dot"></div>

        </div>


        <!-- 14 -->

        <div class="star a14"
             data-message="अगर कभी आपको लगे कि आप अकेली हैं, तो बस इतना याद रखिएगा— कहीं एक दिल ऐसा भी है, जिसके लिए आपकी ख़ुशी उसकी अपनी ख़ुशी से भी ज़्यादा मायने रखती है।">

            <div class="heart">
                ♥
            </div>

        </div>


        <!-- 15 -->

        <div class="star a15"
             data-message="आपसे कोई बड़ी-बड़ी बातें नहीं करनी, बस छोटी-छोटी ज़िंदगी आपके साथ जीनी है, आपकी हँसी सुननी है, आपकी बातें सुननी हैं, और हर गुज़रते साल में आपको थोड़ा और चाहना है।">

            <div class="star-dot"></div>

        </div>


        <!-- 16 -->

        <div class="star a16"
             data-message="आप मेरी ज़िंदगी में आईं, तो बहुत कुछ बदल गया, शायद दुनिया वही रही, बस उसे देखने वाला मेरा दिल बदल गया।">

            <div class="star-dot"></div>

        </div>


        <!-- 17 -->

        <div class="star a17"
             data-message="आपके साथ मोहब्बत का मतलब समझ आया, कि प्यार सिर्फ़ दिल की धड़कन नहीं होता, किसी की फ़िक्र में सुकून मिलना, और उसकी मुस्कान में अपनी ख़ुशी ढूँढना भी मोहब्बत है।">

            <div class="heart">
                ♥
            </div>

        </div>


        <!-- 18 -->

        <div class="star a18"
             data-message="मेरी कोई ख़्वाहिश बहुत बड़ी नहीं, बस आपकी मुस्कान यूँ ही बनी रहे, आपका हाथ मेरे हाथ में रहे, और हमारी ये मोहब्बत उम्र के साथ और गहरी होती रहे।">

            <div class="star-dot"></div>

        </div>


        <!-- 19 -->

        <div class="star a19"
             data-message="आप मेरे लिए वो एहसास हैं, जिसे शब्दों में पूरा लिखना मुमकिन नहीं, क्योंकि कुछ मोहब्बतें कही नहीं जातीं— बस दिल में रहती हैं, और हर दिन थोड़ी और गहरी होती जाती हैं।">

            <div class="heart">
                ♥
            </div>

        </div>


        <!-- 20 -->

        <div class="star a20"
             data-message="और अगर कभी मुझसे पूछा जाए, कि आपको मैं इतना क्यों चाहता हूँ, तो शायद मेरे पास कोई जवाब ना हो— क्योंकि कुछ लोग वजह बनकर नहीं आते, वो ख़ुद ही घर बन जाते हैं।">

            <div class="heart">
                ♥
            </div>

        </div>

    </div>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="galaxy-header">

        <div class="tiny">
            somewhere between stars
        </div>

        <h2>
            Our Little Galaxy
        </h2>

    </div>


    <!-- =====================================================
         MUSIC
    ====================================================== -->

    <audio
        id="ourSong"
        src="our-song.mp3"
        preload="auto"
        loop>
    </audio>


    <button
        id="musicButton"
        aria-label="Play our song">

        ♪

    </button>


    <div id="musicLabel">
        OUR SONG
    </div>


    <!-- =====================================================
         MESSAGE CARD
    ====================================================== -->

    <div id="message">

        <div class="message-label">
            a message from the stars
        </div>

        <div id="messageText"></div>

        <button id="closeMessage">
            RETURN TO THE GALAXY
        </button>

    </div>


    <div class="hint">
        DRAG THE GALAXY • TOUCH A STAR
    </div>

</div>


<script>

/* =========================================================
   STAR SHOWER
========================================================= */

const rainContainer =
    document.getElementById("rain");

for(let i=0;i<340;i++){

    const drop =
        document.createElement("div");

    drop.className="rain";

    drop.style.left =
        Math.random()*100+"%";

    drop.style.height =
        (35+Math.random()*85)+"px";

    drop.style.opacity =
        .2+Math.random()*.8;

    drop.style.animationDuration =
        (.65+Math.random()*1.7)+"s";

    drop.style.animationDelay =
        Math.random()*2.8+"s";

    rainContainer.appendChild(drop);
}


/* =========================================================
   DISTANT GALAXY STARS
========================================================= */

const distantContainer =
    document.getElementById("distantStars");

for(let i=0;i<450;i++){

    const star =
        document.createElement("div");

    star.className="distant-star";

    const size =
        .5+Math.random()*2.2;

    star.style.width =
        size+"px";

    star.style.height =
        size+"px";

    star.style.left =
        Math.random()*100+"%";

    star.style.top =
        Math.random()*100+"%";

    star.style.animationDuration =
        (1.5+Math.random()*5)+"s";

    star.style.animationDelay =
        Math.random()*5+"s";

    distantContainer.appendChild(star);
}


/* =========================================================
   OPEN GALAXY AFTER 3 SECONDS
========================================================= */

setTimeout(()=>{

    const opening =
        document.getElementById("opening");

    opening.style.opacity="0";

    opening.style.visibility="hidden";

    document
        .getElementById("galaxy")
        .classList.add("visible");

},3000);


/* =========================================================
   MUSIC
========================================================= */

const song =
    document.getElementById("ourSong");

const musicButton =
    document.getElementById("musicButton");

const musicLabel =
    document.getElementById("musicLabel");

let musicStarted=false;


/*
   Browser audio policy:
   Music begins only after the user interacts.
*/

function startMusic(){

    song.play()
        .then(()=>{

            musicStarted=true;

            musicButton.classList.add("playing");

            musicButton.innerHTML="♫";

            musicLabel.classList.add("show");

            setTimeout(()=>{

                musicLabel.classList.remove("show");

            },3000);

        })
        .catch(()=>{

            musicStarted=false;

        });
}


/*
   First tap anywhere on the galaxy starts
   the song automatically.
*/

function firstInteraction(){

    if(!musicStarted){

        startMusic();

    }

}

document
    .getElementById("galaxy")
    .addEventListener(
        "pointerdown",
        firstInteraction,
        {once:false}
    );


/*
   Music button:
   play / pause
*/

musicButton.addEventListener(
    "click",
    (event)=>{

        event.stopPropagation();

        if(song.paused){

            song.play()
                .then(()=>{

                    musicStarted=true;

                    musicButton
                        .classList
                        .add("playing");

                    musicButton.innerHTML="♫";

                    musicLabel
                        .classList
                        .add("show");

                });

        }else{

            song.pause();

            musicButton
                .classList
                .remove("playing");

            musicButton.innerHTML="♪";

            musicLabel
                .classList
                .remove("show");

        }

    }
);


/* =========================================================
   STAR CLICK
========================================================= */

const interactiveStars =
    document.querySelectorAll(".star");

const messageBox =
    document.getElementById("message");

const messageText =
    document.getElementById("messageText");


interactiveStars.forEach(star=>{

    star.addEventListener(
        "click",
        function(event){

            event.stopPropagation();

            /*
               Make absolutely sure the music starts
               when a star is touched.
            */

            if(!musicStarted){

                startMusic();

            }

            const text =
                this.getAttribute(
                    "data-message"
                );

            createBurst(this);

            messageText.textContent =
                text;

            setTimeout(()=>{

                messageBox
                    .classList
                    .add("show");

            },350);

        }
    );

});


/* =========================================================
   BURST EFFECT
========================================================= */

function createBurst(element){

    const rect =
        element.getBoundingClientRect();

    const centerX =
        rect.left+
        rect.width/2;

    const centerY =
        rect.top+
        rect.height/2;

    for(let i=0;i<48;i++){

        const particle =
            document.createElement("div");

        particle.className="burst";

        particle.style.left =
            centerX+"px";

        particle.style.top =
            centerY+"px";

        const angle =
            Math.random()*Math.PI*2;

        const distance =
            35+
            Math.random()*115;

        particle.style.setProperty(
            "--x",
            Math.cos(angle)*
            distance+
            "px"
        );

        particle.style.setProperty(
            "--y",
            Math.sin(angle)*
            distance+
            "px"
        );

        document.body.appendChild(
            particle
        );

        setTimeout(()=>{

            particle.remove();

        },1000);

    }

    element.style.transform =
        "scale(0)";

    setTimeout(()=>{

        element.style.transform =
            "";

    },650);

}


/* =========================================================
   CLOSE MESSAGE
========================================================= */

document
    .getElementById("closeMessage")
    .addEventListener(
        "click",
        (event)=>{

            event.stopPropagation();

            messageBox
                .classList
                .remove("show");

        }
    );


/* =========================================================
   GALAXY DRAG
========================================================= */

const camera =
    document.getElementById("camera");

let dragging=false;

let currentX=0;
let currentY=0;

let lastX=0;
let lastY=0;

let velocityX=0;
let velocityY=0;


/* =========================================================
   MOUSE
========================================================= */

document.addEventListener(
    "mousedown",
    event=>{

        if(
            event.target.closest(".star") ||
            event.target.closest("#message") ||
            event.target.closest("#musicButton")
        ){
            return;
        }

        dragging=true;

        lastX=event.clientX;
        lastY=event.clientY;

        velocityX=0;
        velocityY=0;

    }
);


document.addEventListener(
    "mousemove",
    event=>{

        if(!dragging)return;

        const dx =
            event.clientX-lastX;

        const dy =
            event.clientY-lastY;

        currentX+=dx;
        currentY+=dy;

        velocityX=dx;
        velocityY=dy;

        lastX=event.clientX;
        lastY=event.clientY;

        updateCamera();

    }
);


document.addEventListener(
    "mouseup",
    ()=>{

        if(!dragging)return;

        dragging=false;

        startMomentum();

    }
);


/* =========================================================
   TOUCH
========================================================= */

document.addEventListener(
    "touchstart",
    event=>{

        if(
            event.target.closest(".star") ||
            event.target.closest("#message") ||
            event.target.closest("#musicButton")
        ){
            return;
        }

        const touch =
            event.touches[0];

        dragging=true;

        lastX=touch.clientX;
        lastY=touch.clientY;

        velocityX=0;
        velocityY=0;

    },
    {passive:true}
);


document.addEventListener(
    "touchmove",
    event=>{

        if(!dragging)return;

        const touch =
            event.touches[0];

        const dx =
            touch.clientX-lastX;

        const dy =
            touch.clientY-lastY;

        currentX+=dx;
        currentY+=dy;

        velocityX=dx;
        velocityY=dy;

        lastX=touch.clientX;
        lastY=touch.clientY;

        updateCamera();

    },
    {passive:true}
);


document.addEventListener(
    "touchend",
    ()=>{

        if(!dragging)return;

        dragging=false;

        startMomentum();

    }
);


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

    const maxX =
        window.innerWidth*.19;

    const maxY =
        window.innerHeight*.19;

    currentX =
        Math.max(
            -maxX,
            Math.min(
                maxX,
                currentX
            )
        );

    currentY =
        Math.max(
            -maxY,
            Math.min(
                maxY,
                currentY
            )
        );

    camera.style.transform =
        `translate3d(
            ${currentX}px,
            ${currentY}px,
            0
        ) scale(1.08)`;

}


/* =========================================================
   SWIPE MOMENTUM
========================================================= */

function startMomentum(){

    function move(){

        if(dragging)return;

        currentX+=velocityX;
        currentY+=velocityY;

        velocityX*=.93;
        velocityY*=.93;

        updateCamera();

        if(
            Math.abs(velocityX)>.15 ||
            Math.abs(velocityY)>.15
        ){

            requestAnimationFrame(move);

        }

    }

    requestAnimationFrame(move);

}


/* =========================================================
   GENTLE GALAXY FLOAT
========================================================= */

let floatTime=0;

function ambientMovement(){

    if(
        !dragging &&
        Math.abs(velocityX)<.15 &&
        Math.abs(velocityY)<.15
    ){

        floatTime+=.008;

        const floatX =
            Math.sin(floatTime)*2.5;

        const floatY =
            Math.cos(
                floatTime*.8
            )*2;

        camera.style.transform =
            `translate3d(
                ${currentX+floatX}px,
                ${currentY+floatY}px,
                0
            ) scale(1.08)`;

    }

    requestAnimationFrame(
        ambientMovement
    );
}

ambientMovement();


/* =========================================================
   DOUBLE TAP = RESET
========================================================= */

let lastTap=0;

document.addEventListener(
    "touchend",
    ()=>{

        const now=Date.now();

        if(now-lastTap<300){

            currentX=0;
            currentY=0;

            velocityX=0;
            velocityY=0;

            updateCamera();

        }

        lastTap=now;

    }
);


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        const amount=25;

        if(event.key==="ArrowLeft")
            currentX+=amount;

        if(event.key==="ArrowRight")
            currentX-=amount;

        if(event.key==="ArrowUp")
            currentY+=amount;

        if(event.key==="ArrowDown")
            currentY-=amount;

        if(event.key==="Escape")
            messageBox
                .classList
                .remove("show");

        updateCamera();

    }
);


/* =========================================================
   PREVENT BROWSER GESTURES
========================================================= */

document.addEventListener(
    "gesturestart",
    event=>{
        event.preventDefault();
    }
);

document.addEventListener(
    "gesturechange",
    event=>{
        event.preventDefault();
    }
);

document.addEventListener(
    "gestureend",
    event=>{
        event.preventDefault();
    }
);

</script>

</body>
    </html>
